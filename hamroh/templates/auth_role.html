{% extends "base.html" %}
{% block title %}Hamroh — rolni tanlash{% endblock %}

{% block content %}
<div class="max-w-sm mx-auto mt-6">
  <h1 class="text-2xl font-semibold mb-1 text-center">Siz kimsiz?</h1>
  <p class="text-slate-600 mb-8 text-center">Bu tanlovni keyinroq o'zgartirib bo'lmaydi</p>

  <form method="post" action="{{ url_for('auth_pages.set_role') }}" class="space-y-3">
    <button type="submit" name="role" value="patient"
            class="w-full rounded-xl border border-slate-300 bg-white p-4 text-left hover:border-teal-500 hover:shadow-sm transition">
      <div class="font-medium">Bemorman</div>
      <div class="text-sm text-slate-500">Davolanishimni kuzatib boraman</div>
    </button>
    <button type="submit" name="role" value="doctor"
            class="w-full rounded-xl border border-slate-300 bg-white p-4 text-left hover:border-teal-500 hover:shadow-sm transition">
      <div class="font-medium">Shifokorman</div>
      <div class="text-sm text-slate-500">Bemorlarimni kuzatib boraman</div>
    </button>
  </form>

  <p class="text-center text-sm text-slate-500 mt-6">
    Shifokoringizdan kod olganmisiz?
    <a href="{{ url_for('patient_redeem_pages.redeem_form') }}" class="text-teal-700 hover:underline">Kodni kiriting</a>
  </p>
</div>
{% endblock %}

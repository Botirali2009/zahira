{% extends "base.html" %}
{% block title %}Hamroh — mijoz qo'shish{% endblock %}

{% block header_extra %}
  <a href="{{ url_for('doctor_patients_pages.list_patients') }}" class="text-sm text-teal-700 hover:underline">← Bemorlarim</a>
{% endblock %}

{% block content %}
<div class="max-w-lg mx-auto">
  <h1 class="text-2xl font-semibold mb-6">Mijoz qo'shish</h1>

  <form method="post" action="{{ url_for('doctor_patients_pages.add_submit') }}"
        enctype="multipart/form-data" class="space-y-4 bg-white rounded-xl border border-slate-200 p-4">

    <div>
      <label class="block text-sm font-medium mb-1">Ism-familiya</label>
      <input type="text" name="full_name" required
             class="w-full rounded-lg border border-slate-300 px-3 py-3 text-base focus:outline-none focus:ring-2 focus:ring-teal-500">
    </div>

    <div>
      <label class="block text-sm font-medium mb-1">Telefon</label>
      <input type="tel" name="phone" placeholder="+998 90 123 45 67"
             class="w-full rounded-lg border border-slate-300 px-3 py-3 text-base focus:outline-none focus:ring-2 focus:ring-teal-500">
    </div>

    <div>
      <label class="block text-sm font-medium mb-1">Tashxis</label>
      <textarea name="diagnosis" rows="3"
                class="w-full rounded-lg border border-slate-300 px-3 py-3 text-base focus:outline-none focus:ring-2 focus:ring-teal-500"></textarea>
    </div>

    <div>
      <label class="block text-sm font-medium mb-2">Tashxisga oid fayllar (ixtiyoriy)</label>
      <input type="file" name="files" multiple accept=".pdf,.jpg,.jpeg,.png"
             class="w-full text-sm rounded-lg border border-slate-300 px-3 py-3">
    </div>

    <button type="submit"
            class="w-full rounded-lg bg-teal-600 text-white px-5 py-3 font-medium hover:bg-teal-700">
      Kod yaratish
    </button>
  </form>
</div>
{% endblock %}

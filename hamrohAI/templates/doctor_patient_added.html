{% extends "base.html" %}
{% block title %}Hamroh — kod yaratildi{% endblock %}

{% block content %}
<div class="max-w-sm mx-auto mt-6 text-center">
  <h1 class="text-xl font-semibold mb-1">{{ patient['full_name'] }} qo'shildi</h1>
  <p class="text-slate-600 mb-6">Bu kodni bemorga bering — ilovaga kirganda shu kodni kiritadi.</p>

  <div class="bg-white rounded-xl border-2 border-teal-500 p-6 mb-6">
    <div class="text-3xl font-mono font-semibold tracking-widest text-teal-700">{{ code }}</div>
  </div>

  <a href="{{ url_for('doctor_patients_pages.list_patients') }}"
     class="inline-block rounded-lg bg-teal-600 text-white px-5 py-3 font-medium hover:bg-teal-700">
    Bemorlarimga qaytish
  </a>
</div>
{% endblock %}

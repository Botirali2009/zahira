{% extends "base.html" %}
{% block title %}Hamroh — kodni kiriting{% endblock %}

{% block content %}
<div class="max-w-sm mx-auto mt-6">
  <h1 class="text-2xl font-semibold mb-1 text-center">Shifokor kodi</h1>
  <p class="text-slate-600 mb-6 text-center">Shifokoringiz bergan kodni kiriting</p>

  <form method="post" action="{{ url_for('patient_redeem_pages.redeem_submit') }}" class="space-y-3">
    <input type="text" name="code" required autocomplete="off" autocapitalize="characters"
           placeholder="ABCD123"
           class="w-full text-center text-2xl font-mono tracking-widest rounded-lg border border-slate-300 px-3 py-4 focus:outline-none focus:ring-2 focus:ring-teal-500">
    <button type="submit"
            class="w-full rounded-lg bg-teal-600 text-white px-5 py-3 font-medium hover:bg-teal-700">
      Tasdiqlash
    </button>
  </form>

  <p class="text-center text-sm text-slate-500 mt-6">
    <a href="{{ url_for('auth_pages.role') }}" class="hover:underline">Kodim yo'q</a>
  </p>
</div>
{% endblock %}
